---
- name: Clean up packages
  community.general.portage:
    package: net-wireless/wireless-tools
    state: absent
    depclean: true

- name: Update @world
  block:
    - name: Update @world until it converges
      ansible.builtin.include_tasks: update_world_pass.yml
      vars:
        gentoo_system_update_pass: 1

    - name: Warn if @world did not converge
      ansible.builtin.debug:
        msg: >-
          @world did not converge after {{ gentoo_system_update_max_passes }} passes —
          manual intervention may be needed
      when: not gentoo_system_update_settled | default(false)

    - name: Rebuild packages broken by slot changes
      community.general.portage:
        package: "@preserved-rebuild"
        state: present
      changed_when: false
      failed_when: false

  rescue:
    - name: Warn on world update failure
      ansible.builtin.debug:
        msg: "World update failed — manual intervention may be needed"

- name: "Request reboot after kernel update" # noqa: no-handler
  ansible.builtin.debug:
    msg: "Kernel update detected, requesting reboot"
  when:
    - gentoo_system_update_kernel_bumped | default(false)
  notify: Reboot system
